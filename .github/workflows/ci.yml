name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: make all

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

      - name: Lifecycle race tests
        run: go test -race ./internal/buffer ./internal/migrate ./cmd/etiquetta

      - name: Validate installer
        run: bash -n install.sh
